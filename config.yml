# SystemStatus 配置文件
# 修改后重启服务生效。所有字段均可省略，省略时使用下方默认值。

# 服务监听配置
server:
  host: 0.0.0.0      # 监听地址，0.0.0.0 表示允许外部访问
  port: 8001         # 监听端口

# 面板显示开关
display:
  show_network: true   # 是否显示网卡信息
  show_battery: true   # 是否显示电池状态

# 磁盘过滤：被匹配到的分区不会出现在监控面板中。
# 三者为"或"关系，命中任意一项即过滤。
# - devices:    按设备名（完整匹配）过滤，如 /dev/nvme0n1p1、/dev/loop0
# - mountpoints:按挂载点（完整匹配，或以该路径为前缀）过滤，如 /boot/efi、/snap
# - fstypes:    按文件系统类型过滤，如 vfat、squashfs、tmpfs
disk_filter:
  devices: []
  mountpoints:
    - /boot/efi
  fstypes:
    - vfat
    - squashfs
    - tmpfs

# WebUI 配置
web_ui: 
  # 自定义浏览器页面的标题
  page_title: 
    # 启用
    enable: false
    # 不同语言的配置
    # 未配置的项目将使用语言文件中的默认值，默认为“系统监控面板“
    lang: 
      zh-CN: 
      de-DE:
      en-US:
      es-ES:
      fr-FR:
      id-ID:
      ja-JP:
      ko-KR:
      ru-RU:
      th-TH:
  # 自定义网页页面的标题
  web_title:
    # 启用
    enable: false
    # 不同语言的配置
    # 未配置的项目将使用语言文件中的默认值，默认为“SystemStatus“
    lang: 
      zh-CN: 
      de-DE:
      en-US:
      es-ES:
      fr-FR:
      id-ID:
      ja-JP:
      ko-KR:
      ru-RU:
      th-TH: