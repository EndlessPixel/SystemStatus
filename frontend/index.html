<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统监控面板</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div id="app">
        <!-- 侧边栏 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo">
                <span class="logo-dot"></span>
                <span class="logo-text" data-i18n="appName">SystemStatus</span>
            </div>
            <nav class="sidebar-nav" id="sidebar-nav">
                <a class="nav-item active" data-section="overview" href="#overview">
                    <span class="nav-icon">▦</span>
                    <span class="nav-label" data-i18n="navOverview">基础信息</span>
                </a>
                <a class="nav-item" data-section="cpu" href="#cpu">
                    <span class="nav-icon">▣</span>
                    <span class="nav-label" data-i18n="navCPU">CPU监控</span>
                </a>
                <a class="nav-item" data-section="memory" href="#memory">
                    <span class="nav-icon">▤</span>
                    <span class="nav-label" data-i18n="navMemory">内存监控</span>
                </a>
                <a class="nav-item" data-section="disk" href="#disk">
                    <span class="nav-icon">▥</span>
                    <span class="nav-label" data-i18n="navDisk">硬盘监控</span>
                </a>
                <a class="nav-item" data-section="gpu" href="#gpu">
                    <span class="nav-icon">◈</span>
                    <span class="nav-label" data-i18n="navGPU">GPU监控</span>
                </a>
                <a class="nav-item" data-section="network" href="#network">
                    <span class="nav-icon">⧉</span>
                    <span class="nav-label" data-i18n="navNetwork">网络监控</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <select id="theme-select" class="sidebar-select" title="主题">
                    <option value="light" data-i18n="themeLight">浅色</option>
                    <option value="dark" data-i18n="themeDark">深色</option>
                    <option value="high-contrast" data-i18n="themeHighContrast">高对比度</option>
                </select>
                <select id="lang-select" class="sidebar-select" title="语言">
                    <option value="zh">简体中文</option>
                    <option value="en">English</option>
                    <option value="ja">日本語</option>
                    <option value="fr">Français</option>
                    <option value="de">Deutsch</option>
                    <option value="ru">Русский</option>
                    <option value="ko">한국어</option>
                </select>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <header class="topbar">
                <button class="sidebar-toggle" id="sidebar-toggle" aria-label="toggle">☰</button>
                <h1 class="topbar-title" data-i18n="title">系统监控面板</h1>
                <div class="status-indicator" id="connection-status">
                    <span class="status-dot" id="status-dot"></span>
                    <span class="status-text" id="status-text" data-i18n="connecting">正在连接后端服务...</span>
                </div>
                <div class="topbar-actions">
                    <button id="collapse-all" class="action-btn" data-i18n="collapseAll">折叠所有图表</button>
                    <button id="expand-all" class="action-btn" data-i18n="expandAll">展开所有图表</button>
                </div>
            </header>

            <div class="content-scroll">
                <!-- 基础信息 -->
                <section class="content-section active" id="section-overview" data-section="overview">
                    <div class="section-head">
                        <h2 data-i18n="navOverview">基础信息</h2>
                    </div>
                    <div class="status-bar" id="status-bar"></div>
                    <div class="hardware-grid" id="hardware-overview"></div>
                    <div class="charts-root" id="charts-overview"></div>
                </section>

                <!-- CPU 监控 -->
                <section class="content-section" id="section-cpu" data-section="cpu">
                    <div class="section-head">
                        <h2 data-i18n="navCPU">CPU监控</h2>
                    </div>
                    <div class="charts-root" id="charts-cpu"></div>
                </section>

                <!-- 内存监控 -->
                <section class="content-section" id="section-memory" data-section="memory">
                    <div class="section-head">
                        <h2 data-i18n="navMemory">内存监控</h2>
                    </div>
                    <div class="memory-info" id="memory-info"></div>
                    <div class="charts-root" id="charts-memory"></div>
                </section>

                <!-- 硬盘监控 -->
                <section class="content-section" id="section-disk" data-section="disk">
                    <div class="section-head">
                        <h2 data-i18n="navDisk">硬盘监控</h2>
                    </div>
                    <div class="charts-root" id="charts-disk"></div>
                    <div class="smart-section" id="smart-section">
                        <h3 data-i18n="smartTitle">SMART 属性</h3>
                        <div id="smart-container"></div>
                    </div>
                </section>

                <!-- GPU 监控 -->
                <section class="content-section" id="section-gpu" data-section="gpu">
                    <div class="section-head">
                        <h2 data-i18n="navGPU">GPU监控</h2>
                    </div>
                    <div class="gpu-info" id="gpu-info"></div>
                    <div class="charts-root" id="charts-gpu"></div>
                </section>

                <!-- 网络监控 -->
                <section class="content-section" id="section-network" data-section="network">
                    <div class="section-head">
                        <h2 data-i18n="navNetwork">网络监控</h2>
                    </div>
                    <div class="charts-root" id="charts-network"></div>
                    <div class="network-info" id="network-info"></div>
                </section>
            </div>

            <footer class="footer">
                <span data-i18n="footerProject">SystemStatus / EndlessPixel-SS</span>
                <span class="footer-copy" data-i18n="footerCopyright">Copyright © 2024-2026 EndlessPixel Studio. All Rights Reserved.</span>
            </footer>
        </main>

        <div class="sidebar-overlay" id="sidebar-overlay"></div>
    </div>

    <script src="/translations.js"></script>
    <script src="/locales/zh.js"></script>
    <script src="/locales/en.js"></script>
    <script src="/locales/ja.js"></script>
    <script src="/locales/fr.js"></script>
    <script src="/locales/de.js"></script>
    <script src="/locales/ru.js"></script>
    <script src="/locales/ko.js"></script>
    <script src="/echarts_lib/echarts.min.js"></script>
    <script src="/script.js"></script>
</body>
</html>
