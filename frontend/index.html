<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title">系统监控面板</title>

    <!-- Tailwind CSS v4（浏览器运行时编译） -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <!-- 引入本地 style.css（含 @import "tailwindcss" 与 Apple 风格设计令牌），由 browser runtime 编译 -->
    <link rel="stylesheet" href="/static/style.css">

    <!-- ECharts 本地库 -->
    <script src="/static/echarts_lib/echarts.js"></script>
    <!-- 轻提示库 -->
    <link rel="stylesheet" href="/static/tip_lib/tip.css">
    <script src="/static/tip_lib/tip.js"></script>

    <!-- 多语言（先加载各语言，再聚合） -->
    <script src="/static/locales/zh-CN.js"></script>
    <script src="/static/locales/en-US.js"></script>
    <script src="/static/locales/ja-JP.js"></script>
    <script src="/static/locales/fr-FR.js"></script>
    <script src="/static/locales/de-DE.js"></script>
    <script src="/static/locales/ru-RU.js"></script>
    <script src="/static/locales/ko-KR.js"></script>
    <script src="/static/locales/es-ES.js"></script>
    <script src="/static/locales/id-ID.js"></script>
    <script src="/static/locales/th-TH.js"></script>
    <script src="/static/translations.js"></script>
</head>

<body class="min-h-screen">
    <div class="flex min-h-screen">

        <!-- ===== 侧边栏 ===== -->
        <aside class="sidebar-bg w-64 shrink-0 flex flex-col p-5 sticky top-0 h-screen">
            <div class="flex items-center gap-3 px-2 mb-8 mt-1">
                <div class="w-9 h-9 rounded-xl flex items-center justify-center"
                     style="background:var(--color-accent)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12h4l3 8 4-16 3 8h4" />
                    </svg>
                </div>
                <div>
                    <div class="text-[15px] font-semibold leading-tight" data-i18n="appName">SystemStatus</div>
                    <div class="text-[11px] text-[var(--color-faint)]" data-i18n="appDesc">系统监控面板</div>
                </div>
            </div>

            <nav id="sidebar-nav" class="flex flex-col gap-1"></nav>

            <div class="mt-auto px-2 pt-6">
                <div class="flex items-center gap-2 text-[12px] text-[var(--color-faint)]">
                    <span id="status-dot" class="status-dot" style="background:var(--color-faint)"></span>
                    <span id="status-text" data-i18n="connecting">连接中…</span>
                </div>
            </div>
        </aside>

        <!-- ===== 主内容 ===== -->
        <main class="flex-1 min-w-0 p-7 lg:p-9">
            <!-- 顶部概览 -->
            <header class="mb-7">
                <h1 class="text-[26px] font-semibold tracking-tight" data-i18n="pageTitle">系统概览</h1>
                <p id="subtitle" class="text-[13px] text-[var(--color-faint)] mt-1"></p>
            </header>

            <!-- 基础信息 -->
            <section id="sec-basic" class="section active" data-section="basic"></section>

            <!-- CPU 监控 -->
            <section id="sec-cpu" class="section" data-section="cpu"></section>

            <!-- 内存监控 -->
            <section id="sec-memory" class="section" data-section="memory"></section>

            <!-- 硬盘监控 -->
            <section id="sec-disk" class="section" data-section="disk"></section>

            <!-- GPU 监控 -->
            <section id="sec-gpu" class="section" data-section="gpu"></section>

            <!-- 网络监控 -->
            <section id="sec-network" class="section" data-section="network"></section>
        </main>
    </div>

    <script src="/static/script.js"></script>
</body>

</html>
